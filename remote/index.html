<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imágenes en la nube</title>
<style>
  :root { --bg:#14161a; --panel:#1e2127; --borde:#2e333b; --texto:#e8e8ea; --suave:#9aa0a8; --acento:#7c9cff; --peligro:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--texto); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--borde); }
  header h1 { font-size:18px; margin:0; }
  #info { color:var(--suave); font-size:13px; }
  main { display:grid; grid-template-columns:minmax(280px,380px) 1fr; gap:16px; padding:16px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--borde); border-radius:10px; padding:14px; }
  label { display:block; font-size:13px; color:var(--suave); margin:10px 0 4px; }
  textarea, input, select { width:100%; background:var(--bg); color:var(--texto); border:1px solid var(--borde); border-radius:8px; padding:8px; font:inherit; }
  textarea { min-height:130px; resize:vertical; }
  .fila { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  button { background:var(--acento); color:#0b0d12; border:0; border-radius:8px; padding:10px 14px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.sec { background:transparent; color:var(--texto); border:1px solid var(--borde); font-weight:500; }
  button.peligro { background:var(--peligro); }
  #generar { width:100%; margin-top:14px; }
  #refs { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  #refs img { width:64px; height:64px; object-fit:cover; border-radius:6px; cursor:pointer; border:1px solid var(--borde); }
  #estado { margin-top:10px; color:var(--suave); min-height:1.4em; }
  #galeria { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .tarjeta { position:relative; }
  .tarjeta img { width:100%; border-radius:8px; display:block; }
  .tarjeta .botones { position:absolute; top:6px; right:6px; display:flex; gap:4px; opacity:0; transition:opacity .15s; }
  .tarjeta:hover .botones, .tarjeta:focus-within .botones { opacity:1; }
  @media (hover:none) { .tarjeta .botones { opacity:1; } }
  .tarjeta .botones button { padding:4px 8px; font-size:13px; background:rgba(20,22,26,.85); color:var(--texto); border:1px solid var(--borde); }
  .tarjeta .botones button.borrar:hover { background:var(--peligro); color:#0b0d12; }
  #refs { align-items:center; }
  .tarjeta > img { cursor:zoom-in; }
  #visor { position:fixed; inset:0; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #visor[hidden] { display:none; }
  #visor img { max-width:100%; max-height:calc(100vh - 90px); border-radius:8px; box-shadow:0 8px 40px rgba(0,0,0,.6); }
  #visor .barra { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  #visor .nav { position:fixed; top:50%; transform:translateY(-50%); font-size:28px; padding:6px 14px; background:rgba(20,22,26,.8); color:var(--texto); border:1px solid var(--borde); }
  #visor .ant { left:12px; } #visor .sig { right:12px; }
  #visor .cerrar { position:fixed; top:12px; right:12px; background:rgba(20,22,26,.8); color:var(--texto); border:1px solid var(--borde); }
  #fuerzaCaja { margin-top:8px; }
  #fuerza { padding:0; }
  .acciones { display:flex; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <div><h1 id="titulo">En la nube</h1><div id="info">Cargando…</div></div>
  <div class="acciones">
    <a href="/api/imagenes.zip"><button class="sec">Descargar todas (zip)</button></a>
    <button class="sec" id="borrarTodas">Borrar todas</button>
    <button class="peligro" id="destruir">Apagar y borrar la instancia</button>
  </div>
</header>
<main>
  <section class="panel">
    <label for="prompt">Descripción</label>
    <textarea id="prompt" placeholder="Una foto de…"></textarea>
    <div id="soloQwen" hidden>
      <label for="negativo">Qué evitar (opcional)</label>
      <input id="negativo" placeholder="borroso, texto deformado…">
      <label><input id="rapido" type="checkbox" style="width:auto"> Rápido (Lightning, 4 pasos)</label>
    </div>
    <label for="tam">Tamaño</label>
    <select id="tam">
      <option value="1024x1024">Cuadrada 1024×1024</option>
      <option value="1216x832">Horizontal 1216×832</option>
      <option value="832x1216">Vertical 832×1216</option>
      <option value="1344x768">Panorámica 1344×768</option>
      <option value="768x1344">Retrato alto 768×1344</option>
      <option value="1536x1536">Grande 1536×1536 (más lenta)</option>
    </select>
    <div class="fila">
      <div><label for="pasos">Pasos</label><input id="pasos" type="number" min="4" max="60" value="20"></div>
      <div><label for="guia" id="lguia">Guía</label><input id="guia" type="number" min="1" max="10" step="0.5" value="4"></div>
      <div><label for="semilla">Semilla</label><input id="semilla" placeholder="al azar"></div>
    </div>
    <div id="refCaja">
      <label id="lref">Imágenes de referencia (opcional, hasta 4; clic para quitar)</label>
      <input id="fichero" type="file" accept="image/*" multiple>
      <div id="refs"></div>
      <div id="fuerzaCaja" hidden>
        <label for="fuerza">Cuánto cambiar la referencia: <span id="fuerzaTxt">60 %</span></label>
        <input id="fuerza" type="range" min="10" max="100" step="5" value="60">
      </div>
    </div>
    <button id="generar">Generar</button>
    <div id="estado"></div>
  </section>
  <section class="panel"><div id="galeria"></div></section>
</main>
<div id="visor" hidden>
  <button class="cerrar" title="Cerrar (Esc)">✕</button>
  <button class="nav ant" title="Anterior (←)">‹</button>
  <img alt="">
  <button class="nav sig" title="Siguiente (→)">›</button>
  <div class="barra">
    <a id="visorDescargar"><button class="sec">Descargar</button></a>
    <button class="sec" id="visorRef">Usar como referencia</button>
    <button class="peligro" id="visorBorrar">Borrar</button>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const refs = [];
let modelo = null;
let maxRefs = 4;

const TAMAÑOS = {
  flux2: [['1024x1024','Cuadrada 1024×1024'],['1216x832','Horizontal 1216×832'],['832x1216','Vertical 832×1216'],
          ['1344x768','Panorámica 1344×768'],['768x1344','Retrato alto 768×1344'],['1536x1536','Grande 1536×1536 (más lenta)']],
  qwen:  [['1328x1328','Cuadrada 1328×1328'],['1664x928','Panorámica 16:9 1664×928'],['928x1664','Vertical 9:16 928×1664'],
          ['1472x1104','Horizontal 4:3 1472×1104'],['1104x1472','Vertical 3:4 1104×1472']],
};

function prepararModelo(m, hayRapido) {
  modelo = m;
  const qwen = m === 'qwen';
  $('#titulo').textContent = (qwen ? 'Qwen-Image' : 'FLUX.2 dev') + ' · en la nube';
  document.title = (qwen ? 'Qwen-Image' : 'FLUX.2') + ' en la nube';
  $('#tam').innerHTML = TAMAÑOS[m].map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
  $('#soloQwen').hidden = !qwen;
  maxRefs = qwen ? 1 : 4;
  if (qwen) $('#lref').textContent = 'Imagen de referencia (opcional): la nueva imagen parte de ella. Clic para quitar.';
  if (qwen) $('#prompt').placeholder = 'Mejor en inglés. El texto que deba salir escrito, entre comillas: a sign that says "Hola Julio"';
  $('#lguia').textContent = qwen ? 'CFG' : 'Guía';
  $('#guia').value = qwen ? 2.5 : 4;
  $('#pasos').value = qwen ? 30 : 20;
  if (!hayRapido) $('#rapido').parentElement.hidden = true;
  else if (qwen) { $('#rapido').checked = true; $('#rapido').onchange({target: $('#rapido')}); }
}
$('#rapido').onchange = e => { $('#pasos').value = e.target.checked ? 4 : 30; $('#guia').disabled = e.target.checked; };

async function info() {
  try {
    const d = await (await fetch('/api/estado')).json();
    if (!modelo) prepararModelo(d.modelo, d.rapido);
    const p = [d.gpu];
    if (d.min_hasta_inactividad != null) p.push(`se borra sola tras ${d.min_hasta_inactividad} min sin generar`);
    if (d.min_hasta_limite != null) p.push(`límite: ${d.min_hasta_limite} min`);
    $('#info').textContent = p.filter(Boolean).join(' · ');
  } catch { $('#info').textContent = 'Sin conexión con la instancia'; }
}

function añadir(nombre, arriba) {
  const url = '/api/imagen/' + encodeURIComponent(nombre);
  const div = document.createElement('div');
  div.className = 'tarjeta';
  div.dataset.nombre = nombre;
  div.innerHTML = `<img loading="lazy" src="${url}" alt="" title="Ver en grande">
    <div class="botones"><button class="usar" title="Usar como referencia">Referencia</button><button class="borrar" title="Borrar">Borrar</button></div>`;
  div.querySelector('img').onclick = () => abrirVisor(div);
  div.querySelector('.borrar').onclick = () => borrarTarjeta(div);
  div.querySelector('.usar').onclick = () => usarTarjeta(div);
  arriba ? $('#galeria').prepend(div) : $('#galeria').append(div);
}

const urlDe = div => '/api/imagen/' + encodeURIComponent(div.dataset.nombre);

async function borrarTarjeta(div) {
  if (!confirm('¿Borrar esta imagen? No se puede recuperar.')) return false;
  await fetch(urlDe(div), {method:'DELETE'});
  div.remove();
  return true;
}

async function usarTarjeta(div) {
  const d = await (await fetch('/api/referencia/' + encodeURIComponent(div.dataset.nombre), {method:'POST'})).json();
  ponerRef(d.name, urlDe(div));
}

// Visor a pantalla completa: clic en una imagen; flechas para moverse, Esc para cerrar.
let visorActual = null;
function abrirVisor(div) {
  visorActual = div;
  $('#visor img').src = urlDe(div);
  $('#visorDescargar').href = urlDe(div);
  $('#visorDescargar').download = div.dataset.nombre;
  $('#visor').hidden = false;
}
function cerrarVisor() { $('#visor').hidden = true; visorActual = null; }
function moverVisor(paso) {
  if (!visorActual) return;
  const otra = paso > 0 ? visorActual.nextElementSibling : visorActual.previousElementSibling;
  if (otra) abrirVisor(otra);
}
$('#visor .cerrar').onclick = cerrarVisor;
$('#visor .ant').onclick = () => moverVisor(-1);
$('#visor .sig').onclick = () => moverVisor(1);
$('#visor').onclick = e => { if (e.target.id === 'visor') cerrarVisor(); };
$('#visorRef').onclick = async () => { await usarTarjeta(visorActual); cerrarVisor(); };
$('#visorBorrar').onclick = async () => {
  const div = visorActual, siguiente = div.nextElementSibling || div.previousElementSibling;
  if (await borrarTarjeta(div)) siguiente ? abrirVisor(siguiente) : cerrarVisor();
};
document.addEventListener('keydown', e => {
  if ($('#visor').hidden) return;
  if (e.key === 'Escape') cerrarVisor();
  if (e.key === 'ArrowLeft') moverVisor(-1);
  if (e.key === 'ArrowRight') moverVisor(1);
});

function ponerRef(nombre, src) {
  if (refs.length >= maxRefs) { refs.length = 0; $('#refs').innerHTML = ''; }
  refs.push(nombre);
  const img = document.createElement('img'); img.src = src; img.title = 'Quitar';
  img.onclick = () => { refs.splice(refs.indexOf(nombre), 1); img.remove(); actualizarFuerza(); };
  $('#refs').append(img);
  actualizarFuerza();
}

function actualizarFuerza() { $('#fuerzaCaja').hidden = !(modelo === 'qwen' && refs.length); }
$('#fuerza').oninput = e => { $('#fuerzaTxt').textContent = e.target.value + ' %'; };

$('#borrarTodas').onclick = async () => {
  if (!confirm('¿Borrar TODAS las imágenes generadas? Descárgalas antes si las quieres.')) return;
  await fetch('/api/borrar-todas', {method:'POST'});
  $('#galeria').innerHTML = '';
};

async function cargarGaleria() {
  (await (await fetch('/api/lista')).json()).forEach(n => añadir(n, false));
}

$('#fichero').onchange = async e => {
  for (const f of e.target.files) {
    const fd = new FormData(); fd.append('image', f);
    const d = await (await fetch('/api/subir', {method:'POST', body:fd})).json();
    ponerRef(d.name, URL.createObjectURL(f));
  }
  e.target.value = '';
};

$('#generar').onclick = async () => {
  const prompt = $('#prompt').value.trim();
  if (!prompt) { $('#estado').textContent = 'Escribe una descripción.'; return; }
  const [width, height] = $('#tam').value.split('x').map(Number);
  $('#generar').disabled = true;
  const t0 = Date.now();
  try {
    const r = await fetch('/api/generar', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt, width, height, steps:+$('#pasos').value, guidance:+$('#guia').value, seed:$('#semilla').value, refs,
        negativo:$('#negativo').value, rapido:$('#rapido').checked, fuerza:+$('#fuerza').value / 100})});
    const d = await r.json();
    if (!r.ok) throw new Error(JSON.stringify(d.error));
    while (true) {
      await new Promise(s => setTimeout(s, 2000));
      const j = await (await fetch('/api/trabajo/' + d.id)).json();
      const seg = Math.round((Date.now() - t0) / 1000);
      if (j.estado === 'hecho') { j.imagenes.forEach(n => añadir(n, true)); $('#estado').textContent = `Hecha en ${seg} s · semilla ${d.seed}`; break; }
      if (j.estado === 'error') throw new Error(j.error);
      $('#estado').textContent = `${j.estado === 'generando' ? 'Generando' : 'En cola'}… ${seg} s`;
    }
  } catch (e) { $('#estado').textContent = 'Error: ' + e.message; }
  $('#generar').disabled = false;
  info();
};

$('#destruir').onclick = async () => {
  if (!confirm('Se borrará la instancia por completo, con todas las imágenes que no hayas descargado. ¿Seguir?')) return;
  await fetch('/api/destruir', {method:'POST'});
  document.body.innerHTML = '<p style="padding:24px">Borrando la instancia… Puedes cerrar esta página. Ejecuta igualmente bajar.ps1 para confirmar que ya no existe.</p>';
};

info(); cargarGaleria(); setInterval(info, 60000);
</script>
</body>
</html>
